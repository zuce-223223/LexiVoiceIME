name: Convert HCCR FP32 model

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyTorch CPU and PNNX
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy
          python -m pip install pnnx --no-deps

      - name: Download checkpoint and model definition
        run: |
          mkdir -p hccr-work
          curl -L --retry 3 --fail -o hccr-work/best.pt \
            https://hf-mirror.com/Ismantic/Handwritten/resolve/main/best.pt
          curl -L --retry 3 --fail -o hccr-work/model.py \
            https://hf-mirror.com/Ismantic/Handwritten/resolve/main/model.py
          cp tools/convert_hccr_fp32.py hccr-work/convert.py
          ls -lh hccr-work

      - name: Export FP32 NCNN
        working-directory: hccr-work
        env:
          HCCR_OUT: out
        run: python convert.py

      - name: Upload FP32 NCNN model
        uses: actions/upload-artifact@v4
        with:
          name: hccr-fp32
          path: |
            hccr-work/out/model.ncnn.param
            hccr-work/out/model.ncnn.bin
          if-no-files-found: error
