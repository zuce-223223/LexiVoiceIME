name: Build Debug APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Verify project directories
        run: |
          mkdir -p app/libs
          mkdir -p app/src/main/assets
          ls -la app/libs app/src/main/assets

      - name: Download Sherpa-ONNX 1.12.29 Android AAR
        run: |
          curl -L --fail -o app/libs/sherpa-onnx-1.12.29.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.29/sherpa-onnx-1.12.29.aar

      - name: Download ncnn Android prebuilt (for handwriting JNI)
        run: |
          curl -L --fail --retry 3 -o ncnn-android.zip \
            https://github.com/Tencent/ncnn/releases/download/20260113/ncnn-20260113-android.zip
          mkdir -p ncnn-extract
          unzip -q ncnn-android.zip -d ncnn-extract
          echo "=== ncnn extracted layout ==="
          find ncnn-extract -maxdepth 3 -type d | head -40
          # 规整为 CMakeLists 期望的 third_party/ncnn-android/arm64-v8a/
          SRC=$(find ncnn-extract -type d -name arm64-v8a | head -1)
          echo "SRC=$SRC"
          if [ -z "$SRC" ]; then echo "arm64-v8a dir not found"; find ncnn-extract -maxdepth 2 -type d; exit 1; fi
          mkdir -p third_party/ncnn-android
          cp -r "$SRC" third_party/ncnn-android/arm64-v8a
          echo "=== normalized layout ==="
          find third_party/ncnn-android/arm64-v8a -maxdepth 3 \( -name "ncnnConfig.cmake" -o -name "libncnn.a" -o -name "libncnn.so" \) | head

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          for i in 1 2 3; do
            echo "=== Gradle build attempt $i ==="
            if gradle assembleDebug --stacktrace --no-daemon; then
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              echo "Build attempt $i failed (transient dependency errors possible). Retrying in 60s..."
              sleep 60
            fi
          done
          exit 1

      - name: Verify APK output path
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LexiVoiceIME-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
